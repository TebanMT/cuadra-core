# CI — checks de calidad en cada PR y push a main.
#
# Dos jobs independientes:
#   - lint:   gofmt + go vet (servidor + sidecar).
#   - test:   go test -tags "server sidecar" con Postgres real (las
#             migraciones se aplican antes de los tests).
#
# Esto NO compila el binario de release ni despliega — solo valida que el
# código está sano. El build del binario y el deploy a prod viven en
# release.yml y se disparan SOLO con un tag semver (vX.Y.Z). Así puedes
# subir todos los commits que quieras a main sin tocar producción.
#
# Este workflow también es reutilizable (`workflow_call`): release.yml lo
# invoca para re-validar el commit exacto que se va a taggear antes de
# construir y desplegar.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Misma versión que en scripts/deploy/00-bootstrap.sh.
env:
  GO_VERSION: "1.25.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt -l (debe estar vacío)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::Archivos sin formatear:"
            echo "$out"
            exit 1
          fi

      - name: go vet (server tag)
        run: go vet -tags server ./...

      - name: go vet (sidecar tag)
        run: go vet -tags sidecar ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tinta
          POSTGRES_PASSWORD: tinta_dev
          POSTGRES_DB: tinta
        ports:
          - 5432:5432
        # Health check para que el step que sigue espere a que arranque.
        options: >-
          --health-cmd "pg_isready -U tinta -d tinta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Las dos formas que el repo usa: DB_URL la lee el Makefile,
      # DATABASE_URL la leen los tests de integración (sidecartoken,
      # etc). Apuntan al mismo Postgres del service container.
      DB_URL: postgresql://tinta:tinta_dev@localhost:5432/tinta?sslmode=disable
      DATABASE_URL: postgresql://tinta:tinta_dev@localhost:5432/tinta?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Aplicar migraciones Postgres
        run: make migrate-postgres

      - name: go test (server + sidecar)
        # El sidecar usa CGO via mattn/go-sqlite3; ubuntu-latest trae gcc.
        env:
          CGO_ENABLED: "1"
        run: go test -tags "server sidecar" -race -count=1 ./...
