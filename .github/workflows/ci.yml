# CI — corre en cada PR y push a main.
#
# Tres jobs independientes:
#   - lint:   gofmt + go vet (servidor + sidecar).
#   - test:   go test -tags "server sidecar" con Postgres real (las
#             migraciones se aplican antes de los tests).
#   - build:  cross-compile cuadra-server linux/amd64 — verifica que el
#             binario que se va a deployar de verdad linkea sin warnings.
#
# El job `deploy` vive en deploy.yml y se gatea con éxito de estos tres.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Misma versión que en scripts/deploy/00-bootstrap.sh.
env:
  GO_VERSION: "1.25.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt -l (debe estar vacío)
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::Archivos sin formatear:"
            echo "$out"
            exit 1
          fi

      - name: go vet (server tag)
        run: go vet -tags server ./...

      - name: go vet (sidecar tag)
        run: go vet -tags sidecar ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cuadra
          POSTGRES_PASSWORD: cuadra_dev
          POSTGRES_DB: cuadra
        ports:
          - 5432:5432
        # Health check para que el step que sigue espere a que arranque.
        options: >-
          --health-cmd "pg_isready -U cuadra -d cuadra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Las dos formas que el repo usa: DB_URL la lee el Makefile,
      # DATABASE_URL la leen los tests de integración (sidecartoken,
      # etc). Apuntan al mismo Postgres del service container.
      DB_URL: postgresql://cuadra:cuadra_dev@localhost:5432/cuadra?sslmode=disable
      DATABASE_URL: postgresql://cuadra:cuadra_dev@localhost:5432/cuadra?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Aplicar migraciones Postgres
        run: make migrate-postgres

      - name: go test (server + sidecar)
        # El sidecar usa CGO via mattn/go-sqlite3; ubuntu-latest trae gcc.
        env:
          CGO_ENABLED: "1"
        run: go test -tags "server sidecar" -race -count=1 ./...

  build:
    # Solo gastar minutos de runner si lint + test pasan. Si falla
    # cualquiera de los dos, no tiene sentido cross-compilar — el
    # binario nunca se va a deployar de todos modos.
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Cross-compile cuadra-server (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -tags server -trimpath -ldflags="-s -w" \
            -o bin/cuadra-server-linux-amd64 ./cmd/server
          ls -lh bin/cuadra-server-linux-amd64

      - name: Build sidecar (host arch, CGO)
        # Solo verificamos que linkee — el binario que de verdad se
        # bundlea con Tauri lo construye cuadra-desktop en su propio CI.
        env:
          CGO_ENABLED: "1"
        run: go build -tags sidecar -o bin/cuadra-sidecar ./cmd/sidecar

      - name: Subir artefacto (cuadra-server linux/amd64)
        # Lo guardamos para que deploy.yml lo descargue sin recompilar.
        # Retención corta — solo se usa en el deploy inmediato.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cuadra-server-linux-amd64
          path: bin/cuadra-server-linux-amd64
          retention-days: 7
          if-no-files-found: error
