# Deploy tinta-server → Hetzner CX33.
#
# Triggered automáticamente en push a main, después de que CI pasa.
# Reusa el binario que `build` ya compiló (no recompila) y lo manda al
# servidor con el mismo flujo que scripts/deploy/02-deploy-binary.sh:
# scp atómico → rsync migraciones → psql → systemctl restart.
#
# Required GitHub repo secrets (Settings → Secrets and variables →
# Actions → Repository secrets):
#
#   DEPLOY_HOST          IP o hostname del Hetzner. Ej: 204.168.214.238
#                        o api.entinta.app. Para el SSH conviene la IP
#                        directa y reservar api.entinta.app para el smoke
#                        test, pero cualquiera funciona.
#
#   DEPLOY_SSH_KEY       Private key (formato OpenSSH, completa con
#                        BEGIN/END) de un par dedicado para el deploy.
#                        Genera uno aparte de tu key personal con:
#                          ssh-keygen -t ed25519 -f deploy_key -C "gha-deploy"
#                        Sube la pública a /home/tinta/.ssh/authorized_keys
#                        en el server (append, no overwrite).
#
#   DEPLOY_KNOWN_HOSTS   Output de `ssh-keyscan -H <DEPLOY_HOST>`.
#                        Esto fija el host key para evitar MITM y
#                        confirmaciones interactivas. Regenerar si el
#                        servidor se reinstala (cambian las host keys).
#
# Optional secrets:
#
#   SMOKE_TEST_URL       URL pública del health endpoint para verificar
#                        después del restart. Default: https://api.entinta.app/health
#                        Si todavía no tienes DNS configurado, puedes
#                        ponerle https://<DEPLOY_HOST>/health (con el
#                        cert self-signed que Caddy usa antes del
#                        primer ACME) — el step lo deja como warning si
#                        falla, no como error.

name: Deploy tinta-server

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Solo un deploy a la vez. Si hay otro push mientras este corre, se
# encola; no cancelamos in-progress porque a media transferencia el
# servicio queda en estado raro.
concurrency:
  group: deploy-tinta-server
  cancel-in-progress: false

jobs:
  deploy:
    # Solo si CI pasó (o si fue gatillado a mano).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Permissions del GITHUB_TOKEN. CRÍTICO para `workflow_run` triggers:
    # `actions: read` permite que actions/download-artifact baje artifacts
    # del run que disparó este workflow (el job `build` del ci.yml). Sin
    # esto, GITHUB_TOKEN no tiene scope para leer artifacts cross-workflow
    # y falla con "Resource not accessible by integration".
    permissions:
      actions: read     # download-artifact desde el run de CI
      contents: read    # checkout del repo
      deployments: write # marcar el deploy en GitHub Environments

    environment:
      # Marca el deploy como "production" en GitHub Environments —
      # útil para protected deploys + manual approval si decides
      # activarlo en Settings → Environments.
      name: production
      url: https://api.entinta.app

    steps:
      - name: Checkout (para migraciones SQL)
        uses: actions/checkout@v4

      - name: Descargar binario del run de CI
        # Cuando lo dispara workflow_run, el artefacto vive en el run
        # que lo gatilló — no en este. Por eso filtramos por run-id.
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: tinta-server-linux-amd64
          path: bin/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build (fallback para workflow_dispatch)
        # workflow_dispatch no tiene artefacto previo. Cross-compilamos
        # acá mismo con la misma flag config que CI.
        if: github.event_name == 'workflow_dispatch'
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          # Setup-go a mano porque solo entramos a este branch a veces.
          curl -fsSL https://go.dev/dl/go1.25.3.linux-amd64.tar.gz \
            | sudo tar -C /usr/local -xz
          export PATH=$PATH:/usr/local/go/bin
          go build -tags server -trimpath -ldflags="-s -w" \
            -o bin/tinta-server-linux-amd64 ./cmd/server

      - name: Verificar binario
        # GitHub Actions artifacts usan ZIP, que NO preserva el executable
        # bit Unix. El binario baja con perms 644, así que restauramos +x
        # antes de probarlo. (En el server el chmod se rehace después del
        # scp, así que esto solo afecta la verificación local del runner.)
        run: |
          chmod +x bin/tinta-server-linux-amd64
          test -x bin/tinta-server-linux-amd64
          ls -lh bin/tinta-server-linux-amd64
          file bin/tinta-server-linux-amd64

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configurar known_hosts
        # No usamos ssh-keyscan en vivo — eso sería TOFU y MITMable.
        # El secret DEPLOY_KNOWN_HOSTS lo regeneras a mano con:
        #   ssh-keyscan -H <DEPLOY_HOST> | base64
        # (o sin base64 si prefieres pegarlo plano en el secret).
        env:
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Subir binario (atómico)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          REMOTE_BIN=/opt/tinta/bin/tinta-server
          scp bin/tinta-server-linux-amd64 \
            tinta@${DEPLOY_HOST}:${REMOTE_BIN}.new
          ssh tinta@${DEPLOY_HOST} "
            set -e
            chmod +x ${REMOTE_BIN}.new
            mv ${REMOTE_BIN}.new ${REMOTE_BIN}
          "

      - name: Sincronizar migraciones SQL
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -avz --delete \
            db_migrations/postgres/ \
            tinta@${DEPLOY_HOST}:/opt/tinta/migrations/

      - name: Aplicar migraciones
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh tinta@${DEPLOY_HOST} bash -s <<'EOF'
          set -euo pipefail
          source /opt/tinta/tinta-server.env
          for f in $(ls -1 /opt/tinta/migrations/*.sql | sort); do
            echo "  applying $(basename "$f")"
            psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -f "$f" >/dev/null
          done
          echo "✓ Migraciones aplicadas"
          EOF

      - name: Reiniciar tinta-server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh tinta@${DEPLOY_HOST} 'sudo /bin/systemctl restart tinta-server'

          # Esperamos a que systemd reporte active. Si en 30s no está
          # corriendo, falla el deploy y nos avisa.
          for i in $(seq 1 15); do
            status=$(ssh tinta@${DEPLOY_HOST} 'sudo /bin/systemctl is-active tinta-server' || true)
            if [ "$status" = "active" ]; then
              echo "✓ tinta-server activo"
              exit 0
            fi
            echo "(intento $i) status=$status — esperando..."
            sleep 2
          done

          echo "::error::tinta-server no quedó activo después del restart"
          ssh tinta@${DEPLOY_HOST} 'sudo /bin/systemctl status tinta-server --no-pager -l | tail -30'
          ssh tinta@${DEPLOY_HOST} 'sudo /bin/journalctl -u tinta-server -n 50 --no-pager'
          exit 1

      - name: Smoke test (público)
        # No es bloqueante — si DNS o cert TLS aún no están listos,
        # solo emite warning. La verificación dura es el `is-active`
        # del paso anterior.
        continue-on-error: true
        env:
          URL: ${{ secrets.SMOKE_TEST_URL || 'https://api.entinta.app/health' }}
        run: |
          echo "→ GET ${URL}"
          curl --fail --show-error --silent --max-time 10 -i "${URL}" || \
            echo "::warning::Smoke test falló — revisa DNS / cert TLS / endpoint /health"
