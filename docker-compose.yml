version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cuadra-postgres
    environment:
      POSTGRES_USER: cuadra
      POSTGRES_PASSWORD: cuadra_dev
      POSTGRES_DB: cuadra
    ports:
      - "5432:5432"
    volumes:
      - cuadra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuadra"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cuadra_pgdata:
